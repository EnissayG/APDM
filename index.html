<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Polices locales préchargées : évite le flash police système → web -->
    <link
      rel="preload"
      href="/fonts/nunito-latin-400900.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/lobster-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fonts.css" />
    <title>APDM - L'essentiel à portée de main</title>
    <meta
      name="description"
      content="APDM - Machines distributrices d'essentiels pharmaceutiques pour entreprises et lieux publics à Montréal. Contactez-nous pour un projet ou un partenariat."
    />
    <link rel="icon" type="image/png" href="/apdm-logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:title" content="APDM - L'essentiel à portée de main" />
    <meta
      property="og:description"
      content="Machines distributrices d'essentiels pharmaceutiques pour entreprises et lieux publics à Montréal."
    />
    <meta property="og:image" content="/apdm-logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="APDM - L'essentiel à portée de main" />
    <meta
      name="twitter:description"
      content="Machines distributrices d'essentiels pharmaceutiques pour entreprises et lieux publics à Montréal."
    />
    <meta name="twitter:image" content="/apdm-logo.png" />
  </head>
  <body>
    <!-- Formulaire statique pour la détection Netlify Forms au build (SPA). -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="nom" />
      <input name="entreprise" />
      <input name="courriel" />
      <input name="telephone" />
      <input name="sujet" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
